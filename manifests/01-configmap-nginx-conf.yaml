apiVersion: v1
kind: ConfigMap
metadata:
  name: alaina-nginx-conf
  namespace: alaina
  labels:
    app: alaina
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      # petite optimisation : cache les assets statiques
      location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
      }
    }
